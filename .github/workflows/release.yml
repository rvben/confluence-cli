name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse (defaults to Cargo.toml)"
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        default: true
        type: boolean
      skip_crates_io:
        description: 'Skip crates.io publish'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate release metadata
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          manifest_version=$(grep "^version = \"" Cargo.toml | head -1 | cut -d\" -f2)
          version="${REQUESTED_VERSION#v}"
          version="${version:-$manifest_version}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          test "$manifest_version" = "$version"
          tag="v${version}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          elif [[ "$DRY_RUN" != "true" ]]; then
            test "$GITHUB_REF_TYPE" = "tag"
            test "$GITHUB_REF_NAME" = "$tag"
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Run release check
        run: make release-check

  publish-crates:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Publish to crates.io
        if: ${{ inputs.dry_run != true && inputs.skip_crates_io != true }}
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Test crates.io publish (dry run)
        if: ${{ inputs.dry_run == true && inputs.skip_crates_io != true }}
        run: |
          echo "DRY RUN: Would publish to crates.io"
          cargo publish --dry-run --locked

      - name: Skip crates.io publishing
        if: ${{ inputs.skip_crates_io == true }}
        run: echo "Skipping crates.io publishing as requested"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="confluence-cli-v${version}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/confluence" "dist/${package}/"
          cp README.md CHANGELOG.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          shasum -a 256 "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  build-wheels:
    name: Build PyPI wheel (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --locked --bindings bin --compatibility pypi --out dist
          manylinux: auto
          maturin-version: v1.13.3
          rust-toolchain: 1.96.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false

      - name: Smoke test wheel installation
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          install_root=$(mktemp -d)
          UV_TOOL_DIR="$install_root/tools" UV_TOOL_BIN_DIR="$install_root/bin" \
            uv tool install --offline --force "$wheel"
          "$install_root/bin/confluence" --version

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build PyPI source distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          args: --out dist
          maturin-version: v1.13.3
          rust-toolchain: 1.96.0

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs:
      - build-wheels
      - build-sdist
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/confluence-cli-rs/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sdist
          path: dist

      - name: Publish distributions
        run: uv publish --trusted-publishing always dist/*

  publish:
    needs:
      - build
      - publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist

      - name: Publish GitHub release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.tar.gz.sha256

      - name: Dry Run Summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run complete. Artifacts built but nothing published."
          echo "Archives:"
          find dist -type f | sort

  update-homebrew:
    needs: publish
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: Check for tap deploy key
        id: check-token
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_DEPLOY_KEY not set, skipping Homebrew formula update"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artifacts
        if: steps.check-token.outputs.skip == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist

      - name: Compute release checksums
        if: steps.check-token.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail

          checksum() {
            awk '{print $1}' "$1"
          }

          version="${GITHUB_REF_NAME#v}"
          {
            echo "SHA_MACOS_ARM64=$(checksum "dist/aarch64-apple-darwin/confluence-cli-v${version}-aarch64-apple-darwin.tar.gz.sha256")"
            echo "SHA_MACOS_X86=$(checksum "dist/x86_64-apple-darwin/confluence-cli-v${version}-x86_64-apple-darwin.tar.gz.sha256")"
            echo "SHA_LINUX_X86=$(checksum "dist/x86_64-unknown-linux-gnu/confluence-cli-v${version}-x86_64-unknown-linux-gnu.tar.gz.sha256")"
          } >> "$GITHUB_ENV"

      - name: Update Homebrew formula
        if: steps.check-token.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Authenticate to the tap with a write deploy key scoped to
          # rvben/homebrew-tap. The key does not expire, so cross-repo pushes
          # keep working without periodic token rotation.
          mkdir -p ~/.ssh
          echo "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone git@github.com:rvben/homebrew-tap.git homebrew-tap
          cd homebrew-tap

          cat > Formula/confluence-cli.rb << 'FORMULA'
          class ConfluenceCli < Formula
            desc "Markdown-sync-first Confluence CLI in Rust"
            homepage "https://github.com/rvben/confluence-cli"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/rvben/confluence-cli/releases/download/vVERSION_PLACEHOLDER/confluence-cli-vVERSION_PLACEHOLDER-aarch64-apple-darwin.tar.gz"
                sha256 "SHA_MACOS_ARM64_PLACEHOLDER"
              end

              on_intel do
                url "https://github.com/rvben/confluence-cli/releases/download/vVERSION_PLACEHOLDER/confluence-cli-vVERSION_PLACEHOLDER-x86_64-apple-darwin.tar.gz"
                sha256 "SHA_MACOS_X86_PLACEHOLDER"
              end
            end

            on_linux do
              depends_on arch: :x86_64

              url "https://github.com/rvben/confluence-cli/releases/download/vVERSION_PLACEHOLDER/confluence-cli-vVERSION_PLACEHOLDER-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "SHA_LINUX_X86_PLACEHOLDER"
            end

            def install
              bin.install "confluence"
            end

            test do
              assert_match version, shell_output("#{bin}/confluence --version")
            end
          end
          FORMULA

          sed -i 's/^          //' Formula/confluence-cli.rb
          sed -i "s/VERSION_PLACEHOLDER/${version}/g" Formula/confluence-cli.rb
          sed -i "s/SHA_MACOS_ARM64_PLACEHOLDER/${SHA_MACOS_ARM64}/" Formula/confluence-cli.rb
          sed -i "s/SHA_MACOS_X86_PLACEHOLDER/${SHA_MACOS_X86}/" Formula/confluence-cli.rb
          sed -i "s/SHA_LINUX_X86_PLACEHOLDER/${SHA_LINUX_X86}/" Formula/confluence-cli.rb

          ruby -c Formula/confluence-cli.rb
          if grep -Eq '\b(odie|abort|exit)\b' Formula/confluence-cli.rb; then
            echo "formula must not abort while Homebrew loads the shared tap" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/confluence-cli.rb
          git diff --cached --quiet || git commit -m "Update confluence-cli to ${version}"
          git push

  attest-release:
    name: Attest release artifacts
    needs: publish
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/**/*
