name: CLI health

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: clispec v0.3
    uses: rvben/clispec/.github/workflows/conformance.yml@6fb51e2692272f4723fa8b572c3b175b8d41364f
    with:
      binary: target/debug/confluence

  published-artifacts:
    name: Published artifacts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: rvben/clispec/.github/workflows/published-artifacts.yml@703da8137f537dbd03714761a2da8e1fb026c8c7
    with:
      crates: "confluence-cli"
      homebrew-formula: confluence-cli

  pypi-install:
    name: PyPI uv install
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Install and run the published tool
        shell: bash
        run: |
          set -euo pipefail
          install_root=$(mktemp -d)
          UV_TOOL_DIR="$install_root/tools" UV_TOOL_BIN_DIR="$install_root/bin" \
            uv tool install --force confluence-cli-rs
          "$install_root/bin/confluence" --version
          "$install_root/bin/confluence" schema --command 'page get' >/dev/null
