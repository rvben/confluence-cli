name: CLI health

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: clispec v0.3
    uses: rvben/clispec/.github/workflows/conformance.yml@10181da8fb10638689b29ec9a0fc6b1973cac9c4
    with:
      binary: target/debug/confluence

  published-artifacts:
    name: Published artifacts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: rvben/clispec/.github/workflows/published-artifacts.yml@10181da8fb10638689b29ec9a0fc6b1973cac9c4
    with:
      crates: "confluence-cli"
      homebrew-formula: confluence-cli

  pypi-install:
    name: PyPI uv install
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - name: Install and run the published tool
        shell: bash
        run: |
          set -euo pipefail
          install_root=$(mktemp -d)
          UV_TOOL_DIR="$install_root/tools" UV_TOOL_BIN_DIR="$install_root/bin" \
            uv tool install --force confluence-cli-rs
          "$install_root/bin/confluence" --version
          "$install_root/bin/confluence" schema --command 'page get' >/dev/null
