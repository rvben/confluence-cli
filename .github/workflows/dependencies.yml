name: Dependency health

on:
  schedule:
    - cron: "28 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@b4e11a177cabf80ba04c99dc0efd1c69f05af493 # v0.13.1
    with:
      langs: rust,actions,nix
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt &&
        rustup default 1.96.0 &&
        cargo install cargo-nextest --locked
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
