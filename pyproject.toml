[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "confluence-cli-rs"
dynamic = ["version", "description", "readme", "license", "keywords"]
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Documentation",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/rvben/confluence-cli"
Documentation = "https://github.com/rvben/confluence-cli#readme"
Repository = "https://github.com/rvben/confluence-cli"
Changelog = "https://github.com/rvben/confluence-cli/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
compatibility = "pypi"
strip = true
