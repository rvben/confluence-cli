<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="title description">
  <title id="title">Proof Desk reading an Engineering handbook</title>
  <desc id="description">The authentic medium-width Confluence Proof Desk layout, with a page folio beside a readable page galley.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#18201D" flood-opacity="0.22"/>
    </filter>
    <clipPath id="screen-clip">
      <rect x="22" y="50" width="736" height="286"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="14" y="14" width="752" height="328" rx="9" fill="#18201D"/>
    <path d="M14 50h752v283a9 9 0 0 1-9 9H23a9 9 0 0 1-9-9Z" fill="#F1F3EF"/>
  </g>

  <circle cx="34" cy="32" r="4.5" fill="#A92A43"/>
  <circle cx="51" cy="32" r="4.5" fill="#855300"/>
  <circle cx="68" cy="32" r="4.5" fill="#1F6848"/>
  <text x="390" y="36" text-anchor="middle" fill="#D9DED9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5">confluence tui --space DOCS</text>

  <g clip-path="url(#screen-clip)" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.8" fill="#18201D" xml:space="preserve">
    <rect x="27" y="58" width="92" height="16" fill="#2E4F9B"/>
    <text x="29" y="70" fill="#F1F3EF" font-weight="700"> CONFLUENCE </text>
    <text x="119" y="70" font-weight="700"> PROOF DESK </text>
    <text x="211" y="70" font-weight="700"> BROWSE</text>
    <text x="29" y="85" fill="#505B56">work  /  example.atlassian.net/wiki  /  DOCS</text>
    <text x="29" y="100" fill="#969E98">────────────────────────────────────────────────────────────────────────────────────────────</text>
    <text x="29" y="115" fill="#505B56">┌ CONTENTS  DOCS  /  3 ───────┐┌ GALLEY  001  /  Engineering handbook ─────────────────────┐</text>
    <text x="29" y="130">│&gt; 001 Engineering handbook   ││Engineering handbook                                       │</text>
    <text x="29" y="145">│  002   Release checklist    ││                                                           │</text>
    <text x="29" y="160">│  003   Runbooks             ││Everything the team needs, in one place.                   │</text>
    <text x="29" y="175">│                             ││                                                           │</text>
    <text x="29" y="190">│                             ││Start here                                                 │</text>
    <text x="29" y="205">│                             ││                                                           │</text>
    <text x="29" y="220">│                             ││- Find the release owner                                   │</text>
    <text x="29" y="235">│                             ││- Open the deployment runbook                              │</text>
    <text x="29" y="250">│                             ││                                                           │</text>
    <text x="29" y="265" fill="#969E98">└─────────────────────────────┘└───────────────────────────────────────────────────────────┘</text>
    <text x="29" y="280" fill="#969E98">────────────────────────────────────────────────────────────────────────────────────────────</text>
    <text x="29" y="298" fill="#1F6848" font-weight="700"> Page proof and margin evidence are ready.</text>
    <text x="29" y="318" fill="#505B56">up/down move  <tspan fill="#2E4F9B" font-weight="700">enter</tspan> unfold  <tspan fill="#2E4F9B" font-weight="700">tab</tspan> browse/review  <tspan fill="#2E4F9B" font-weight="700">s</tspan> space  <tspan fill="#2E4F9B" font-weight="700">p</tspan> path  <tspan fill="#2E4F9B" font-weight="700">m</tspan> margin  <tspan fill="#2E4F9B" font-weight="700">?</tspan> map  <tspan fill="#2E4F9B" font-weight="700">q</tspan> quit</text>
  </g>
</svg>
