[package]
name = "confluence-cli"
version = "0.1.31"
edition = "2024"
rust-version = "1.90"
description = "A CLI for reading, searching, syncing, and automating Confluence"
license = "MIT"
documentation = "https://docs.rs/confluence-cli"
homepage = "https://github.com/rvben/confluence-cli"
repository = "https://github.com/rvben/confluence-cli"
readme = "README.md"
keywords = ["confluence", "cli", "markdown", "sync", "atlassian"]
categories = ["command-line-utilities"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "assets/**",
    "docs/**",
    "src/**",
    "tests/**",
]

[[bin]]
name = "confluence"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
comfy-table = "7.2.1"
directories = "6.0.0"
owo-colors = "4"
html2md = "0.2.17"
keyring = "4.2"
libc = "0.2"
mime_guess = "2.0.5"
open = "5.4"
pathdiff = "0.2.3"
pulldown-cmark = "0.13.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "http2", "json", "multipart", "rustls-tls", "rustls-tls-native-roots", "stream"] }
rpassword = "7"
roxmltree = "0.20.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
similar = "2"
slug = "0.1.6"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "time"] }
tempfile = "3.27.0"
url = "2.5.8"
urlencoding = "2.1.3"
walkdir = "2.5.0"

[dev-dependencies]
serial_test = "3"
wiremock = "0.6"
